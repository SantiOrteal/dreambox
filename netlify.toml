# Ambiente de DEV (pruebas): Netlify publica la rama `dev` en https://dreamboxdev.netlify.app.
# Producción irá a Cloudflare con el dominio (ver wrangler.jsonc y el README).
# Las cabeceras HTTP están en public/_headers (compartidas con Cloudflare).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Dev nunca se indexa en Google. VITE_SITE_URL no hace falta: se usa la dirección de Netlify.
  VITE_NOINDEX = "true"
  # La access key de Web3Forms va en Netlify > Site configuration > Environment variables
  # (VITE_WEB3FORMS_KEY). No la pongas vacía aquí: este archivo tiene prioridad sobre el panel.
