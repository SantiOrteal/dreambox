# CD a Cloudflare Workers.
#  - PR a main: sube una versión de vista previa (no toca producción) y comenta su URL en el PR.
#  - Merge a main: despliega a producción (www.dreamboxdev.mx).
# Secrets necesarios: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID. Guía en DEPLOY.md.
name: Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Vista previa
    # Solo PRs de ramas de este repo (los forks no tienen acceso a los secrets).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://www.dreamboxdev.mx' }}
          # Las vistas previas nunca se indexan en Google.
          VITE_NOINDEX: 'true'
          VITE_WEB3FORMS_KEY: ${{ vars.VITE_WEB3FORMS_KEY }}

      - name: Subir versión de vista previa
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          out=$(npx --yes wrangler@4 versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER}: ${PR_TITLE:0:80}" 2>&1 | tee /dev/stderr)
          url=$(printf '%s' "$out" | grep -oE "https://pr-${PR_NUMBER}-[a-z0-9.-]+\.workers\.dev" | head -1)
          if [ -z "$url" ]; then
            echo "::error::No se encontró la URL de vista previa en la salida de wrangler."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comentar la URL en el PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = '<!-- vista-previa-cloudflare -->'
            const body = [
              marker,
              '### Vista previa lista',
              '',
              `${process.env.PREVIEW_URL}`,
              '',
              `Versión del commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\`. No afecta a producción y Google no la indexa.`,
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const previous = comments.find((c) => c.body?.includes(marker))
            if (previous) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })

  production:
    name: Producción
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Nunca dos despliegues a producción a la vez; el siguiente espera al anterior.
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://www.dreamboxdev.mx
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://www.dreamboxdev.mx' }}
          # Mientras la variable VITE_NOINDEX no sea "false", Google no indexa el sitio.
          VITE_NOINDEX: ${{ vars.VITE_NOINDEX || 'true' }}
          VITE_WEB3FORMS_KEY: ${{ vars.VITE_WEB3FORMS_KEY }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}

      - name: Desplegar a Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          title=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)
          npx --yes wrangler@4 deploy --message "${GITHUB_SHA:0:7} ${title:0:80}"
